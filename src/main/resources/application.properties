spring.application.name=crudjava

server.port=5350

spring.datasource.url=jdbc:postgresql://localhost:5432/crudjava
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.kafka.bootstrap-servers=localhost:39092,localhost:39093,localhost:39094
app.kafka.consumer-group-id=crudjava-sample-group
app.kafka.default-topic=crudjava-sample-topic
